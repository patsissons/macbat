[package]
name = "macbat"
version = "1.2.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/patsissons/macbat"

[dependencies]
clap = { version = "4", features = ["derive"] }
core-foundation = "0.10"
crossterm = "0.29"
plist = "1"
ratatui = "0.30"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[profile.release]
lto = true
strip = true
codegen-units = 1
